steps:
  # 1. Build the Backend Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args: 
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/local-aid-repo/api'
      - '-f'
      - 'api.Dockerfile'
      - '.'

  # 2. Push the Backend image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'us-central1-docker.pkg.dev/$PROJECT_ID/local-aid-repo/api']

  # 3. Deploy Backend to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'local-aid-api'
      - '--image'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/local-aid-repo/api'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'

  # 4. Build the Frontend Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args: 
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/local-aid-repo/web'
      - '-f'
      - 'web.Dockerfile'
      - '--build-arg'
      - 'VITE_API_URL=${_API_URL}'
      - '.'

  # 5. Push the Frontend image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'us-central1-docker.pkg.dev/$PROJECT_ID/local-aid-repo/web']

  # 6. Deploy Frontend to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'local-aid-web'
      - '--image'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/local-aid-repo/web'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '8080'

options:
  logging: CLOUD_LOGGING_ONLY

substitutions:
  _API_URL: 'https://api.localaid.site'

images:
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/local-aid-repo/api'
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/local-aid-repo/web'