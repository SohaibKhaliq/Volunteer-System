steps:
  # 1. Build Backend Image
  - name: 'gcr.io/cloud-builders/docker'
    args: 
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/local-aid-repo/api'
      - '-f'
      - 'api.Dockerfile'
      - '.'

  # 2. Build Frontend Image
  - name: 'gcr.io/cloud-builders/docker'
    args: 
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/local-aid-repo/web'
      - '-f'
      - 'web.Dockerfile'
      - '--build-arg'
      - 'VITE_API_URL=${_API_URL}'
      - '.'

  # 3. Push images to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'us-central1-docker.pkg.dev/$PROJECT_ID/local-aid-repo/api']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'us-central1-docker.pkg.dev/$PROJECT_ID/local-aid-repo/web']

  # 4. Deploy Backend
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'local-aid-api'
      - '--image'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/local-aid-repo/api'
      - '--region'
      - 'us-central1'
      - '--set-env-vars'
      - 'HOST=0.0.0.0,NODE_ENV=production' # Vital for health checks
      - '--allow-unauthenticated'

  # 5. Deploy Frontend
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'local-aid-web'
      - '--image'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/local-aid-repo/web'
      - '--region'
      - 'us-central1'
      - '--allow-unauthenticated'

options:
  logging: CLOUD_LOGGING_ONLY

substitutions:
  _API_URL: 'https://api.localaid.site'